<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visual Counter V2</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    :root {
      --bg-color: #121212;
      --box-bg: #2a2a2a;
      --text-color: #ffffff;
      --overlay: rgba(0, 0, 0, 0.4);
      --highlight: #FFCC00;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 1.5rem; width: 100%; }
    .header-actions { display: flex; gap: 8px; }
    
    button {
      cursor: pointer; border: none; border-radius: 8px;
      background: rgba(255, 255, 255, 0.2); color: white;
      padding: 8px 12px; font-size: 0.9rem; font-weight: bold;
    }
    button:active { background: rgba(255, 255, 255, 0.4); }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px 16px;
    }
    .counter-wrapper { display: flex; flex-direction: column; gap: 8px; }
    .counter-box {
      aspect-ratio: 1 / 1; background-color: var(--box-bg); border-radius: 16px;
      position: relative; overflow: hidden; background-size: cover; background-position: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; border: 3px solid transparent;
      transition: border 0.3s;
    }
    .counter-box.target-reached { border-color: var(--highlight); box-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
    
    .ui-layer {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      background: var(--overlay); padding: 10px; transition: background 0.1s;
    }
    .counter-box:active .ui-layer { background: rgba(0, 0, 0, 0.1); }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; gap: 4px; }
    .title-input {
      background: transparent; border: none; color: white; font-weight: bold;
      font-size: 1rem; width: 100%; text-shadow: 1px 1px 2px black;
    }
    .title-input:focus { outline: none; background: rgba(0,0,0,0.5); border-radius: 4px; }
    .target-input {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: var(--highlight);
      border-radius: 4px; width: 40px; text-align: center; font-size: 0.8rem; font-weight: bold;
    }
    
    .count-display {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 4rem; font-weight: bold; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); pointer-events: none; margin: 0;
    }

    .action-bar { display: flex; justify-content: space-between; }
    .icon-btn {
      padding: 4px; font-size: 1.1rem; border-radius: 50%; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.15);
    }

    /* モーダル共通 */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
      z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
    }
    .modal-close { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: white; cursor: pointer; z-index: 10000; }
    
    /* カルーセル */
    .carousel-container { position: relative; width: 100%; height: 80%; display: flex; align-items: center; justify-content: center; }
    #modalImage { max-width: 95%; max-height: 100%; object-fit: contain; border-radius: 8px; }
    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2);
      border: none; color: white; font-size: 2rem; padding: 10px 15px; border-radius: 50%; cursor: pointer;
    }
    .carousel-prev { left: 10px; }
    .carousel-next { right: 10px; }
    .image-counter { position: absolute; bottom: 10%; color: white; font-size: 1.2rem; font-weight: bold; }

    /* ギャラリー */
    .gallery-content { width: 90%; max-height: 80%; overflow-y: auto; background: var(--box-bg); padding: 20px; border-radius: 16px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 20px; }
    .gallery-item { aspect-ratio: 1; background-size: cover; background-position: center; border-radius: 8px; position: relative; border: 2px solid transparent; }
    .gallery-item.is-cover { border-color: var(--highlight); }
    .gallery-item-actions { position: absolute; bottom: 4px; right: 4px; display: flex; gap: 4px; }
    .g-btn { background: rgba(0,0,0,0.7); border: none; border-radius: 4px; font-size: 0.8rem; padding: 4px; cursor: pointer; }
    .add-image-btn { width: 100%; padding: 12px; margin-top: 15px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.5); color: white; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>Visual Counter V2</h1>
    <div class="header-actions">
      <button onclick="exportData()">💾 退避</button>
      <button onclick="document.getElementById('importFile').click()">📂 復元</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      <button onclick="addCounter()">＋ 追加</button>
    </div>
  </header>

  <div id="grid"></div>

  <!-- カルーセルモーダル -->
  <div id="carouselModal" class="modal">
    <div class="modal-close" onclick="closeCarousel()">×</div>
    <div class="carousel-container">
      <button class="carousel-btn carousel-prev" onclick="changeSlide(-1)">◀</button>
      <img id="modalImage" src="" alt="View">
      <button class="carousel-btn carousel-next" onclick="changeSlide(1)">▶</button>
    </div>
    <div id="imageIndexDisplay" class="image-counter">1 / 1</div>
  </div>

  <!-- ギャラリーモーダル -->
  <div id="galleryModal" class="modal">
    <div class="modal-close" onclick="closeGallery()">×</div>
    <div class="gallery-content">
      <h2 style="margin-top:0">画像ギャラリー</h2>
      <p style="font-size:0.8rem; color:#aaa;">📍: 表紙に設定 / 🗑️: 削除</p>
      <div id="galleryGrid" class="gallery-grid"></div>
      <button class="add-image-btn" onclick="document.getElementById('galleryUpload').click()">＋ 新しい画像を追加</button>
      <input type="file" id="galleryUpload" accept="image/*" style="display:none" onchange="uploadToGallery(event)">
    </div>
  </div>

  <script>
    let counters = [];
    let currentCarouselId = null;
    let currentSlideIndex = 0;
    let currentGalleryId = null;

    // データ初期化とV1からのマイグレーション
    function initData() {
      const raw = localStorage.getItem('visual_counters');
      if (raw) {
        let parsed = JSON.parse(raw);
        counters = parsed.map(c => {
          if (!c.images) c.images = [];
          // 古いバージョンの 'image' プロパティを新しい配列形式へ変換
          if (c.image) {
            c.images.push({ id: generateId(), url: c.image, isCover: true });
            delete c.image;
          }
          if (c.target === undefined) c.target = 0; // 目標回数初期値
          return c;
        });
      }
      saveData();
      render();
    }

    function saveData() { localStorage.setItem('visual_counters', JSON.stringify(counters)); }
    function triggerHaptic() { if (navigator.vibrate) navigator.vibrate(40); }
    function generateId() { return '_' + Math.random().toString(36).substr(2, 9); }

    // --- カウンター基本操作 ---
    function addCounter() {
      counters.push({ id: generateId(), title: '', count: 0, target: 0, images: [] });
      saveData(); render();
    }
    function deleteCounter(id) {
      if(confirm('このボックスを完全に削除しますか？')) {
        counters = counters.filter(c => c.id !== id);
        saveData(); render();
      }
    }
    function increment(id) {
      triggerHaptic();
      const c = counters.find(x => x.id === id);
      if (c) { c.count++; saveData(); render(); }
    }
    function decrement(id) {
      triggerHaptic();
      const c = counters.find(x => x.id === id);
      if (c) { c.count--; saveData(); render(); }
    }
    function resetCount(id) {
      const c = counters.find(x => x.id === id);
      if (c && confirm('カウントをリセットしますか？')) { c.count = 0; saveData(); render(); }
    }
    function updateTitle(id, val) { const c = counters.find(x => x.id === id); if(c) { c.title = val; saveData(); } }
    function updateTarget(id, val) { const c = counters.find(x => x.id === id); if(c) { c.target = parseInt(val) || 0; saveData(); render(); } }

    // --- バックアップ（エクスポート/インポート） ---
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(counters));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", "visual_counter_backup.json");
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    }
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          counters = JSON.parse(e.target.result);
          saveData(); render(); alert('復元が完了しました。');
        } catch (err) { alert('ファイルの読み込みに失敗しました。'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // --- 画像圧縮・アップロード ---
    function processImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 500; // 複数枚保存のため圧縮率を強化
          let w = img.width, h = img.height;
          if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
          else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function uploadToGallery(event) {
      const file = event.target.files[0];
      if (!file || !currentGalleryId) return;
      processImage(file, (dataUrl) => {
        const c = counters.find(x => x.id === currentGalleryId);
        const isFirst = c.images.length === 0;
        c.images.push({ id: generateId(), url: dataUrl, isCover: isFirst });
        saveData();
        renderGallery();
        render(); // 背景更新
      });
      event.target.value = '';
    }

    // --- ギャラリー管理 ---
    function openGallery(id) { currentGalleryId = id; renderGallery(); document.getElementById('galleryModal').style.display = 'flex'; }
    function closeGallery() { document.getElementById('galleryModal').style.display = 'none'; currentGalleryId = null; }
    
    function setCover(imageId) {
      const c = counters.find(x => x.id === currentGalleryId);
      c.images.forEach(img => img.isCover = (img.id === imageId));
      saveData(); renderGallery(); render();
    }
    function deleteImage(imageId) {
      if(!confirm('この画像を削除しますか？')) return;
      const c = counters.find(x => x.id === currentGalleryId);
      c.images = c.images.filter(img => img.id !== imageId);
      if(c.images.length > 0 && !c.images.some(img => img.isCover)) {
        c.images[0].isCover = true; // カバーが消えたら最初の画像をカバーに
      }
      saveData(); renderGallery(); render();
    }

    function renderGallery() {
      const c = counters.find(x => x.id === currentGalleryId);
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';
      c.images.forEach(img => {
        const div = document.createElement('div');
        div.className = `gallery-item ${img.isCover ? 'is-cover' : ''}`;
        div.style.backgroundImage = `url(${img.url})`;
        div.innerHTML = `
          <div class="gallery-item-actions">
            <button class="g-btn" onclick="setCover('${img.id}')">📍</button>
            <button class="g-btn" style="color:red;" onclick="deleteImage('${img.id}')">🗑️</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    // --- カルーセル表示 ---
    function openCarousel(id, event) {
      event.stopPropagation();
      const c = counters.find(x => x.id === id);
      if (!c || c.images.length === 0) return;
      currentCarouselId = id;
      // 表紙画像を初期スライドに設定
      const coverIndex = c.images.findIndex(img => img.isCover);
      currentSlideIndex = coverIndex >= 0 ? coverIndex : 0;
      updateCarouselView();
      document.getElementById('carouselModal').style.display = 'flex';
    }
    function closeCarousel() { document.getElementById('carouselModal').style.display = 'none'; currentCarouselId = null; }
    function changeSlide(direction) {
      const c = counters.find(x => x.id === currentCarouselId);
      currentSlideIndex += direction;
      if (currentSlideIndex < 0) currentSlideIndex = c.images.length - 1;
      if (currentSlideIndex >= c.images.length) currentSlideIndex = 0;
      updateCarouselView();
    }
    function updateCarouselView() {
      const c = counters.find(x => x.id === currentCarouselId);
      document.getElementById('modalImage').src = c.images[currentSlideIndex].url;
      document.getElementById('imageIndexDisplay').innerText = `${currentSlideIndex + 1} / ${c.images.length}`;
    }

    // --- メイン描画 ---
    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      counters.forEach(c => {
        const wrapper = document.createElement('div');
        wrapper.className = 'counter-wrapper';
        
        let coverImg = c.images.find(img => img.isCover) || c.images[0];
        const bgStyle = coverImg ? `background-image: url(${coverImg.url});` : '';
        const isTargetReached = c.target > 0 && c.count >= c.target;
        const boxClass = `counter-box ${isTargetReached ? 'target-reached' : ''}`;

        wrapper.innerHTML = `
          <div class="${boxClass}" style="${bgStyle}" onclick="increment('${c.id}')">
            <div class="ui-layer">
              <div class="top-bar">
                <input type="text" class="title-input" value="${c.title}" placeholder="タイトル" 
                       onclick="event.stopPropagation()" onchange="updateTitle('${c.id}', this.value)">
                <input type="number" class="target-input" value="${c.target || ''}" placeholder="目標" title="目標回数"
                       onclick="event.stopPropagation()" onchange="updateTarget('${c.id}', this.value)">
              </div>
              <p class="count-display">${c.count}</p>
              <div style="position:absolute; bottom:10px; right:10px; z-index:10;">
                <button class="icon-btn" style="${c.images.length > 0 ? 'background: rgba(0,0,0,0.6)' : 'opacity:0.3'};" 
                        onclick="openCarousel('${c.id}', event)">👁️</button>
              </div>
            </div>
          </div>
          <div class="action-bar">
            <button class="icon-btn" onclick="decrement('${c.id}')">➖</button>
            <button class="icon-btn" onclick="resetCount('${c.id}')">🔄</button>
            <button class="icon-btn" onclick="openGallery('${c.id}')">🗂️</button>
            <button class="icon-btn" style="background:rgba(255,0,0,0.3)" onclick="deleteCounter('${c.id}')">🗑️</button>
          </div>
        `;
        grid.appendChild(wrapper);
      });
    }

    initData();
  </script>
</body>
</html>
