<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visual Counter</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    :root {
      --bg-color: #121212;
      --box-bg: #2a2a2a;
      --text-color: #ffffff;
      --overlay: rgba(0, 0, 0, 0.4);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 12px;
      backdrop-filter: blur(4px);
      font-size: 1rem;
    }
    button:active { background: rgba(255, 255, 255, 0.4); }

    /* グリッドレイアウト */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px 16px; /* 縦の隙間を少し広めに確保 */
    }

    /* カウンター単位のラッパー */
    .counter-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px; /* ボックスと下のボタン群の間隔 */
    }

    /* カウンターボックス */
    .counter-box {
      aspect-ratio: 1 / 1;
      background-color: var(--box-bg);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    
    .ui-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--overlay);
      padding: 10px;
      transition: background 0.1s;
    }
    .counter-box:active .ui-layer {
      background: rgba(0, 0, 0, 0.1); /* タップ時の明滅フィードバック */
    }

    /* ボックス内上部のUI */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }
    .title-input {
      background: transparent;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      width: 70%;
      text-shadow: 1px 1px 2px black;
    }
    .title-input:focus { outline: none; background: rgba(0,0,0,0.5); border-radius: 4px; }
    
    /* カウント数字 */
    .count-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      margin: 0;
    }

    /* ボックス外下部のボタン群 */
    .action-bar {
      display: flex;
      justify-content: space-between;
    }
    .icon-btn {
      padding: 6px;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15); /* 外側配置用に背景色を調整 */
    }

    /* モーダル */
    #imageModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #modalImage {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Visual Counter</h1>
    <button onclick="addCounter()">＋ ボックス追加</button>
  </header>

  <div id="grid"></div>

  <div id="imageModal" onclick="closeModal()">
    <img id="modalImage" src="" alt="Full Screen">
  </div>

  <script>
    let counters = JSON.parse(localStorage.getItem('visual_counters')) || [];

    function saveData() {
      localStorage.setItem('visual_counters', JSON.stringify(counters));
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function generateId() {
      return '_' + Math.random().toString(36).substr(2, 9);
    }

    function addCounter() {
      counters.push({ id: generateId(), title: '', count: 0, image: '' });
      saveData();
      render();
    }

    function deleteCounter(id) {
      if(confirm('このボックスを削除しますか？')) {
        counters = counters.filter(c => c.id !== id);
        saveData();
        render();
      }
    }

    function increment(id) {
      triggerHaptic();
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count++;
        saveData();
        render();
      }
    }

    // ボックス外のボタンになったため、event.stopPropagation() は不要になりました
    function decrement(id) {
      triggerHaptic();
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count--;
        saveData();
        render();
      }
    }

    function resetCount(id) {
      const counter = counters.find(c => c.id === id);
      if (counter && confirm('カウントを0にリセットしますか？')) {
        counter.count = 0;
        saveData();
        render();
      }
    }

    function updateTitle(id, newTitle) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.title = newTitle;
        saveData();
      }
    }

    function handleImageUpload(event, id) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
          } else {
            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
          const counter = counters.find(c => c.id === id);
          if (counter) {
            counter.image = compressedDataUrl;
            saveData();
            render();
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function openModal(imageUrl, event) {
      event.stopPropagation();
      if (!imageUrl) return;
      document.getElementById('modalImage').src = imageUrl;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      counters.forEach(c => {
        const wrapper = document.createElement('div');
        wrapper.className = 'counter-wrapper';

        // 画像の有無で背景スタイルを切り替え
        const bgStyle = c.image ? `background-image: url(${c.image});` : '';

        wrapper.innerHTML = `
          <!-- カウンター本体 -->
          <div class="counter-box" style="${bgStyle}" onclick="increment('${c.id}')">
            <div class="ui-layer">
              <div class="top-bar">
                <input type="text" class="title-input" value="${c.title}" placeholder="タイトル" 
                       onclick="event.stopPropagation()" onchange="updateTitle('${c.id}', this.value)">
                <!-- 画像のみ表示ボタンはボックス内の右上に留置 -->
                <button class="icon-btn" style="${c.image ? 'background: rgba(0,0,0,0.5)' : 'opacity:0.3'};" 
                        onclick="openModal('${c.image}', event)">👁️</button>
              </div>
              <p class="count-display">${c.count}</p>
            </div>
          </div>
          
          <!-- ボックス下部のアクションバー -->
          <div class="action-bar">
            <button class="icon-btn" onclick="decrement('${c.id}')">➖</button>
            <button class="icon-btn" onclick="resetCount('${c.id}')">🔄</button>
            <button class="icon-btn" onclick="document.getElementById('file-${c.id}').click()">🖼️</button>
            <button class="icon-btn" style="background:rgba(255,0,0,0.3)" onclick="deleteCounter('${c.id}')">🗑️</button>
          </div>
          <input type="file" id="file-${c.id}" accept="image/*" style="display:none" onchange="handleImageUpload(event, '${c.id}')">
        `;
        grid.appendChild(wrapper);
      });
    }

    render();
  </script>
</body>
</html>
